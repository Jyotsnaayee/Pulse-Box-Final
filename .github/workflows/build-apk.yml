name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      # AGP 9.x requires JDK 17 or newer
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # The project has no gradlew / gradle-wrapper.jar, so install the
      # exact Gradle version from gradle-wrapper.properties
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: 9.3.1

      # Finds the folder containing settings.gradle.kts, so the build also
      # works if the project sits inside a subfolder of the repo
      - name: Locate Android project
        shell: bash
        run: |
          SETTINGS=$(find . \( -name settings.gradle.kts -o -name settings.gradle \) -not -path "*/.git/*" | head -n 1)
          if [ -z "$SETTINGS" ]; then
            TOP=$(ls -A | grep -v '^.git$' | tr '\n' ' ')
            echo "::error::No settings.gradle(.kts) in repo. Top-level files: [$TOP]"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # debug.keystore is in .gitignore but app/build.gradle.kts expects it
      # at the project root, so generate it on the runner
      - name: Create debug keystore
        run: |
          cd "$PROJECT_DIR"
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # Optional: only needed if you uncomment GEMINI_API_KEY in .env.example.
      - name: Create .env (optional)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY=$GEMINI_API_KEY" > "$PROJECT_DIR/.env"
          fi

      - name: Show tool versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$PROJECT_DIR"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace --console=plain

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: toolbox-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
